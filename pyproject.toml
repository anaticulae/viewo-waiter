[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "viewo_waiter"
version = "1.0.0"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "configos>=1.0.4,<2.0.0",
    "flask-login>=0.6.3,<1.0.0",
    "flask>=3.1.3,<4.0.0",
    "qvlink>=2.15.7,<3.0.0",
    "utilo>=2.112.1,<3.0.0",
    "utilosafe>=1.0.0,<3.0.0",
    "viewo-api>=1.0.1,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "hoverpower==1.7.0",
    "utilotest==1.1.1",
]

[project.urls]
Homepage = "https://github.com/anaticulae/viewo_waiter"
Repository = "https://github.com/anaticulae/viewo_waiter"

[project.scripts]
viewo_waiter = "viewo_waiter.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
default_bump_level = 2

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "tresor",
    "viewo_waiter",
    "viewo_waiter.api",
    "viewo_waiter.api.document",
    "viewo_waiter.api_",
    "viewo_waiter.api_.document",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "DOCU",
    "MASTER",
]
